<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Venta Rápida - Sabores de Cobquecura</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../css/venta_rapida.css">
    <script src="../js/venta_rapida.js"></script> 
</head>
<body class="bg-light">
    
    <header class="header bg-white shadow-sm fixed-top">
        <div class="header-left container-fluid d-flex align-items-center py-2">
            <div class="hamburger me-3" id="hamburger">
                <span></span><span></span><span></span>
            </div>
            <div class="logo h4 mb-0 text-primary fw-bold">Sabores de Cobquecura</div>
        </div>
    </header>

    <aside class="side-menu shadow" id="sideMenu">
        <h2 class="h5 mb-4 text-primary fw-bold px-3 pt-3">Secciones</h2>
        <nav class="nav flex-column px-2">
            <a class="nav-link py-2 rounded mb-1" href="index.html">🏠 Inicio</a>
            <a class="nav-link py-2 rounded mb-1 active bg-primary text-white" href="#VENTARAPIDA">👨‍🍳 Venta Rápida</a>
        </nav>
    </aside>
    
    <div class="overlay" id="overlay"></div>

    <main class="container content-wrapper mt-5 pt-4">
    <div class="row justify-content-center">
        <div class="col-lg-8 col-md-10">
            
            <div class="card border-0 shadow-sm p-4 rounded-4 main-card-anim">
                <div class="text-center mb-4">
                    <h1 class="h3 fw-bold text-dark">Venta Rápida</h1>
                    <p class="text-muted">Agrega productos y procesa el pago al instante</p>
                </div>

                <div class="row g-3 mb-4 align-items-end bg-light p-3 rounded-3 border">
                    <div class="mb-3 position-relative">
                                <label class="form-label small fw-bold text-primary">Búsqueda Rápida 🔍</label>
                                <input type="text" class="form-control form-control-sm" id="buscador-producto"
                                    placeholder="Buscar por nombre...">
                                <ul class="list-group position-absolute w-100 " id="lista-sugerencias"
                                    style="z-index: 1050; max-height: 150px; overflow-y: auto;"></ul>
                            </div>
                    <div class="col-md-6">
                        <label class="form-label text-secondary fw-semibold small">Producto</label>
                        <select class="form-select shadow-sm border-0" id="producto-select">
                            <option value="" selected disabled>Seleccione un producto...</option>
                            <option value="Tacos al Pastor" data-precio="5000">Tacos al Pastor - $5.000</option>
                            <option value="Enchiladas" data-precio="4000">Enchiladas - $4.000</option>
                            <option value="Empanada de Pino" data-precio="2500">Empanada de Pino - $2.500</option>
                            <option value="Bebida Lata 350cc" data-precio="1500">Bebida Lata 350cc - $1.500</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label text-secondary fw-semibold small">Cantidad</label>
                        <div class="input-group shadow-sm quantity-selector rounded">
                            <button class="btn btn-white border-0 bg-white" type="button" id="btn-minus"><i class="bi bi-dash"></i></button>
                            <input type="number" class="form-control text-center border-0" id="input-cantidad" value="1" min="1" readonly>
                            <button class="btn btn-white border-0 bg-white" type="button" id="btn-plus"><i class="bi bi-plus"></i></button>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <button class="btn btn-success w-100 shadow-sm fw-bold" type="button" id="btn-agregar">
                            <i class="bi bi-plus-circle me-1"></i> Agregar
                        </button>
                    </div>
                </div>

                <div class="table-responsive mb-4">
                    <table class="table table-hover align-middle border-bottom" id="pedido-table">
                        <thead class="table-light">
                            <tr>
                                <th class="text-secondary fw-semibold">Plato</th>
                                <th class="text-secondary fw-semibold text-center">Cant.</th>
                                <th class="text-secondary fw-semibold text-end">Precio Un.</th>
                                <th class="text-secondary fw-semibold text-end">Subtotal</th>
                                <th class="text-center"></th> </tr>
                        </thead>
                        <tbody id="tabla-body">
                            </tbody>
                    </table>
                </div>

                <div class="bg-light rounded-3 p-3 mb-4 d-flex justify-content-between align-items-center border">
                    <span class="fs-5 text-muted fw-semibold">Total a Pagar:</span>
                    <span class="fs-2 fw-bold text-primary total" id="total-text">$0</span>
                </div>

                <div class="mb-4">
                    <label class="form-label text-secondary fw-semibold small d-block mb-2">Método de Pago</label>
                    <div class="btn-group w-100 shadow-sm" role="group" aria-label="Métodos de pago">
                        <input type="radio" class="btn-check" name="metodoPago" id="pago-efectivo" value="Efectivo" autocomplete="off" checked>
                        <label class="btn btn-outline-primary fw-semibold py-2" for="pago-efectivo">
                            <i class="bi bi-cash me-1 d-block d-sm-inline"></i>Efectivo
                        </label>
                    
                        <input type="radio" class="btn-check" name="metodoPago" id="pago-debito" value="Débito" autocomplete="off">
                        <label class="btn btn-outline-primary fw-semibold py-2" for="pago-debito">
                            <i class="bi bi-credit-card me-1 d-block d-sm-inline"></i>Débito
                        </label>
                    
                        <input type="radio" class="btn-check" name="metodoPago" id="pago-credito" value="Crédito" autocomplete="off">
                        <label class="btn btn-outline-primary fw-semibold py-2" for="pago-credito">
                            <i class="bi bi-credit-card-2-front me-1 d-block d-sm-inline"></i>Crédito
                        </label>

                        <input type="radio" class="btn-check" name="metodoPago" id="pago-transferencia" value="Transferencia" autocomplete="off">
                        <label class="btn btn-outline-primary fw-semibold py-2" for="pago-transferencia">
                            <i class="bi bi-phone me-1 d-block d-sm-inline"></i>Transf.
                        </label>
                    </div>
                </div>

                <div class="d-flex gap-3 flex-column flex-sm-row mt-2">

                <div class="d-flex gap-3 flex-column flex-sm-row mt-2">
                    <button class="btn btn-outline-danger flex-grow-1 py-3 fw-bold shadow-sm" onclick="vaciarCuenta()">
                        <i class="bi bi-trash3 me-2"></i>Vaciar Cuenta
                    </button>
                    <button class="btn btn-outline-secondary flex-grow-1 py-3 fw-bold shadow-sm" onclick="window.print()">
                        <i class="bi bi-printer me-2"></i>Imprimir
                    </button>
                    <button class="btn btn-primary flex-grow-1 py-3 fw-bold shadow-sm fs-5" onclick="pagar()">
                        <i class="bi bi-cash-coin me-2"></i>Pagar
                    </button>
                </div>
            </div>

        </div>
    </div>
</main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    
    <script>
        // Cálculo del total adaptado a pesos chilenos
        function calcularTotal() {
            let total = 0;
            const filas = document.querySelectorAll('#pedido-table tbody tr');
            
            filas.forEach(fila => {
                // Obtener el subtotal, quitar el símbolo $, los puntos y espacios
                const textoSubtotal = fila.cells[3].textContent.replace('$', '').replace(/\./g, '').trim();
                const subtotal = parseInt(textoSubtotal);
                
                if(!isNaN(subtotal)) {
                    total += subtotal;
                }
            });
            
            // Formatear a peso chileno (ej: $14.000)
            document.getElementById('total-text').textContent = `$${total.toLocaleString('es-CL')}`;
        }
        
        window.onload = calcularTotal;
    </script>
</body>
</html>
