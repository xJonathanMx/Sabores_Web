<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sabores - Panel de Control Compacto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/Index.css" />
    <link rel="icon" type="image/x-icon" href="../img/R-removebg-preview.png">
    <script src="../js/index.js"></script>
</head>

<body class="bg-light">

    <<header class="header bg-white shadow-sm fixed-top">
        <div class="header-left container-fluid d-flex align-items-center py-2">
            <div class="hamburger me-3" id="hamburger">
                <span></span><span></span><span></span>
            </div>
            <div class="logo h4 mb-0 text-primary fw-bold">Sabores de Cobquecura</div>
        </div>
    </header>

    <aside class="side-menu shadow" id="sideMenu">
        <h2 class="h5 mb-4 text-primary fw-bold px-3 pt-3">Secciones</h2>
        <nav class="nav flex-column px-2">
            <a class="nav-link py-2 rounded mb-1 active bg-primary text-white" href="index.html">🏠 Inicio</a>
            <a class="nav-link py-2 rounded mb-1 " href="venta_Rapida.html">👨‍🍳 Venta Rápida</a>
        </nav>
    </aside>

    <div class="overlay" id="overlay"></div>

    <main class="container-fluid content-wrapper">
        <div class="row g-3">

            <section class="col-lg-7 mesas-scroll-container">
                <div class="card border-0 shadow-sm p-4 main-card-anim">
                    <h2 class="h4 mb-4 text-dark border-bottom pb-2">Plan general de Mesas</h2>
                    <div class="filter-bar d-flex flex-wrap gap-2 mb-4">
                        <button class="btn btn-sm btn-primary filter-btn active" data-filter="all">Todas</button>
                        <button class="btn btn-sm btn-outline-primary filter-btn" data-filter="mi-mesa">Mis
                            Mesas</button>
                        <button class="btn btn-sm btn-outline-primary filter-btn" data-filter="terraza-int">Terraza
                            Int.</button>
                        <button class="btn btn-sm btn-outline-primary filter-btn" data-filter="terraza-ext">Terraza
                            Ext.</button>
                        <button class="btn btn-sm btn-outline-primary filter-btn"
                            data-filter="interior">Interior</button>
                    </div>
                    <div class="mesas-list">
                        <div class="mesa-card disponible">
                            <div class="mesa-info"><span class="mesa-number">Mesa 1</span><span class="mesa-id">ID:
                                    101</span><span class="mesa-garzon">Libre</span></div>
                        </div>
                        <div class="mesa-card ocupada">
                            <div class="mesa-info"><span class="mesa-number">Mesa 2</span><span class="mesa-id">ID:
                                    102</span><span class="mesa-garzon">👤 Juan P.</span></div>
                        </div>
                        <div class="mesa-card disponible">
                            <div class="mesa-info"><span class="mesa-number">Mesa 3</span><span class="mesa-id">ID:
                                    103</span><span class="mesa-garzon">Libre</span></div>
                        </div>
                        <div class="mesa-card ocupada">
                            <div class="mesa-info"><span class="mesa-number">Mesa 4</span><span class="mesa-id">ID:
                                    104</span><span class="mesa-garzon">👤 Ana M.</span></div>
                        </div>
                    </div>
                </div>
            </section>

            <section class="col-lg-5 productos-section">
                <div class="card border-0 shadow-sm h-100 p-3 comanda-panel main-card-anim" style="animation-delay: 0.1s;">
    <div class="comanda-header d-flex justify-content-between align-items-center mb-3">
                        <h2 class="h5 mb-0 text-primary">Gestionar Comanda</h2>
                        <span class="badge bg-light text-primary border fw-bold" id="mesa-selected">Mesa 2 ID:
                            102</span>
                    </div>

                    <div class="comanda-body d-flex gap-3">
                        <div class="comanda-form-side flex-grow-1">
                            <div class="mb-3 position-relative">
                                <label class="form-label small fw-bold text-primary">Búsqueda Rápida 🔍</label>
                                <input type="text" class="form-control form-control-sm" id="buscador-producto"
                                    placeholder="Buscar por nombre...">
                                <ul class="list-group position-absolute w-100 " id="lista-sugerencias"
                                    style="z-index: 1050; max-height: 150px; overflow-y: auto;"></ul>
                            </div>

                            <hr>

                            <div class="mb-2">
                                <label class="form-label small fw-bold">Categoría</label>
                                <select class="form-select form-select-sm" id="categoria">
                                    <option value="mariscos">Mariscos</option>
                                    <option value="carnes">Carnes</option>
                                    <option value="bebidas">Bebidas</option>
                                </select>
                            </div>

                            <div class="mb-2">
                                <label class="form-label small fw-bold">Platos</label>
                                <select class="form-select form-select-sm" id="platos">
                                    <option value="Paila marina">Paila marina</option>
                                    <option value="Lomo a lo Pobre">Lomo a lo Pobre</option>
                                    <option value="Pisco Sour">Pisco Sour</option>
                                </select>
                            </div>

                            <div class="mb-2">
                                <label class="form-label small fw-bold">Cantidad</label>
                                <div class="input-group input-group-sm quantity-selector">
                                    <button class="btn btn-outline-primary fw-bold" type="button"
                                        id="btn-minus">−</button>
                                    <input type="number" class="form-control text-center fw-bold" id="input-cantidad"
                                        value="1" min="1" readonly>
                                    <button class="btn btn-outline-primary fw-bold" type="button"
                                        id="btn-plus">+</button>
                                </div>
                            </div>

                            <div class="mb-2">
                                <label class="form-label small fw-bold">Notas</label>
                                <textarea class="form-control form-control-sm" id="notas-cocina" rows="1"
                                    placeholder="Notas..."></textarea>
                            </div>

                            <button class="btn btn-primary btn-sm w-100" id="btn-agregar">Agregar Producto</button>
                        </div>

                        <div class="comanda-table-side">
                            <h4 class="h6 fw-bold mb-2">Detalle del Pedido</h4>
                            <div class="table-responsive" style="max-height: 250px;">
                                <table
                                    class="table table-sm table-hover table-striped align-middle comanda-table-custom">
                                    <thead class="table-light">
                                        <tr>
                                            <th>Cant.</th>
                                            <th>Producto</th>
                                            <th>Total</th>
                                            <th></th>
                                        </tr>
                                    </thead>
                                    <tbody id="detalle-productos">
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>

                    <div class="comanda-actions mt-auto d-flex flex-column gap-2 pt-3 border-top">
                        <div class="row row-cols-2 g-2 mb-30 ">
                            <div class="col d-flex flex-column gap-2">
                            <button class="btn btn-success" id="btn-guardar"><i class="bi bi-check-circle"></i> Guardar
                                Comanda</button>
                            <button class="btn btn-primary btn-imprimir-ticket">
                                <i class="bi bi-printer"></i> Imprimir Pre-cuenta
                            </button>
                            </div>
                            <div class="col d-flex flex-column gap-2">
                            <a href="pagar_mesa.html" class="btn btn-warning"> Pagar Mesa</a>
                            <button class="btn btn-outline-danger btn-sm">Eliminar Mesa</button></div>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
