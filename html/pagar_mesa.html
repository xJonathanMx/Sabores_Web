<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagar Mesa - Compacto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/pagar_mesa.css">
    <script src="../js/pagar_mesa.js"></script>
    <link rel="stylesheet" href="../css/menu.css">

</head>

<body>
    <div id="menu-container"></div>
    <div class="menu-spacing"></div>
    <div class="container-main">
        <div class="card">
            <div class="header-section d-flex justify-content-between align-items-center">

                <button class="btn btn-light btn-sm">
                    <a href="Index.html" role="button" aria-label="Volver"><i class="fas fa-arrow-left"></i></a>
                </button>

                <h4 class="mb-0">
                    <i class="fas fa-money-bill-wave"></i> Cobro de Mesa
                </h4>

                <span class="badge bg-light text-primary fs-6">
                    Mesa #<span id="mesaNum">5</span>
                </span>

            </div>

            <div class="card-body p-3">
                <div class="row g-2 mb-3">
                    <div class="col-md-6">
                        <div class="info-box waiter-section border-start border-primary border-4 ps-3">
                            <div class="section-title text-primary"><i class="fas fa-user-tie"></i> Mesero</div>
                            <div class="d-flex justify-content-between">
                                <span><span id="waiterName">Juan García</span></span>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="d-flex justify-content-between">
                            <span>Subtotal:</span>
                            <span>$<span id="subtotal">150000</span></span>
                        </div>

                        <div class="d-flex justify-content-between text-muted small">
                            <span>IVA (19%):</span>
                            <span>$<span id="tax">28500</span></span>
                        </div>

                        <div class="d-flex justify-content-between">
                            <span>Propina Sugerida:</span>
                            <span>$<span id="tipDisplay">0</span></span>
                        </div>

                        <hr class="my-1">

                        <div class="d-flex justify-content-between fw-bold text-primary">
                            <span>Total a pagar:</span>
                            <span>$<span id="totalAmount">178500</span></span>
                        </div>
                    </div>
                </div>

                <div class="section-title text-primary"><i class="fas fa-credit-card"></i> Método de Pago</div>
                <div class="payment-methods">
                    <div class="payment-method " onclick="selectPayment(this, 'efectivo')">
                        <i class="fas fa-money-bill"></i> Efectivo
                    </div>
                    <div class="payment-method" onclick="selectPayment(this, 'debito')">
                        <i class="fas fa-credit-card"></i> Débito
                    </div>
                    <div class="payment-method" onclick="selectPayment(this, 'credito')">
                        <i class="fas fa-credit-card"></i> Crédito
                    </div>
                    <div class="payment-method" onclick="selectPayment(this, 'transferencia')">
                        <i class="fas fa-exchange-alt"></i> Transferencia
                    </div>
                </div>
                <div class="section-title text-primary"><i class="fas fa-gift"></i> Propina</div>
                <div class="input-group mb-3">
                    <span class="input-group-text bg-light">$</span>
                    <input type="number" id="tipAmount" class="form-control" placeholder="Monto manual" min="0" step="1"
                        value="0">
                    <button type="button" class="btn btn-outline-primary" onclick="setTip(10)">10%</button>
                    <button type="button" class="btn btn-outline-primary" onclick="setTip(15)">15%</button>
                    <button type="button" class="btn btn-outline-primary" onclick="setTip(20)">20%</button>
                </div>
                <div class="input-group mb-3">
                    <span class="input-group-text bg-light"><i class="fas fa-dollar-sign"></i></span>
                    <input type="number" id="paymentAmount" class="form-control" placeholder="Monto a pagar" min="0"
                        step="1">
                    <button class="btn btn-primary px-4" onclick="addPayment()">Agregar Pago</button>
                </div>

                <div class="row g-3 mb-3">
                    <div class="col-md-7">
                        <div class="section-title text-primary"><i class="fas fa-list"></i> Pagos Registrados</div>
                        <div class="payment-list" id="paymentList">
                            <p class="text-muted text-center my-2 small">No hay pagos registrados</p>
                        </div>
                    </div>
                    <div class="col-md-5">
                        <div class="balance-box h-100 d-flex flex-column justify-content-center bg-light border-start border-primary border-4"
                            id="balanceBox">
                            <div class="d-flex justify-content-between mb-1">
                                <span>Abonado:</span>
                                <strong class="text-primary">$<span id="totalPaid">0.00</span></strong>
                            </div>
                            <div class="d-flex justify-content-between fs-5">
                                <span>Resta:</span>
                                <strong class="text-primary">$<span id="balance">169.50</span></strong>
                            </div>
                        </div>
                    </div>
                </div>



                <div class="row g-2 mt-2">
                    <div class="col-8">
                        <button class="btn btn-primary btn-custom w-100 py-2" id="liberarBtn" onclick="liberarMesa()"
                            disabled>
                            <i class="fas fa-check-circle"></i> Confirmar y Liberar Mesa
                        </button>
                    </div>
                    <div class="col-4">
                        <button class="btn btn-outline-primary btn-custom w-100 py-2" onclick="limpiar()">
                            <i class="fas fa-redo"></i> Limpiar
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
